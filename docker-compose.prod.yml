services:
  postgres:
    image: postgres:18-alpine
    container_name: ats-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats-internal

  ai-service:
    image: ghcr.io/${REPO_OWNER}/ats-ai-service:latest
    container_name: ats-ai-service-prod
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ai_logs:/app/logs
    networks:
      - ats-internal

  server:
    image: ghcr.io/${REPO_OWNER}/ats-server:latest
    container_name: ats-server-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      AI_SERVICE_URL: http://ai-service:5001
    volumes:
      - server_logs:/app/logs
      - server_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    # Menjalankan database migration & seeder admin (dengan || true agar tidak crash saat reboot jika admin sudah terdaftar) sebelum backend server start
    command: sh -c "npm run migrate -- up && (npm run db:seed || true) && npm start"
    ports:
      - "127.0.0.1:5000:5000" # Hanya diakses via local reverse proxy Nginx
    networks:
      - ats-public
      - ats-internal

  client:
    image: ghcr.io/${REPO_OWNER}/ats-client:latest
    container_name: ats-client-prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # Hanya diakses via local reverse proxy Nginx
    networks:
      - ats-public

volumes:
  postgres_data_prod:
  server_logs:
  server_uploads:
  ai_logs:

networks:
  ats-public:
    driver: bridge
  ats-internal:
    driver: bridge
    internal: true
