services:
  postgres:
    image: postgres:18-alpine
    container_name: ats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ats-internal

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ats-ai-service
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    networks:
      - ats-internal

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ats-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_URL: ${DATABASE_URL}
      AI_SERVICE_URL: http://ai-service:5001
    volumes:
      - ./server/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    networks:
      - ats-public
      - ats-internal

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ats-client
    restart: unless-stopped
    env_file:
      - ./client/.env
    depends_on:
      - server
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - ats-public

volumes:
  postgres_data:

networks:
  ats-public:
    driver: bridge
  ats-internal:
    driver: bridge
    internal: true