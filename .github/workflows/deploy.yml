name: CI/CD Pipeline to VPS

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repo name to lowercase
        run: |
          echo "REPO_OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 1. Build & Push Frontend (Client)
      # Menggunakan build-args VITE_API_BASE_URL=https://api.banyakjob.com karena API backend dihosting pada domain terpisah.
      - name: Build & Push Client
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=https://api.banyakjob.com
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER_LOWER }}/ats-client:latest
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER_LOWER }}/ats-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build & Push Backend (Server)
      - name: Build & Push Server
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER_LOWER }}/ats-server:latest
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER_LOWER }}/ats-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Build & Push AI Service
      - name: Build & Push AI Service
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER_LOWER }}/ats-ai-service:latest
            ${{ env.REGISTRY }}/${{ env.REPO_OWNER_LOWER }}/ats-ai-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Convert repo owner to lowercase
        run: |
          echo "REPO_OWNER_LOWER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # Salin docker-compose.prod.yml ke VPS menggunakan SCP
      - name: Copy docker-compose.prod.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "~/ats-project/"

      # SSH ke VPS dan jalankan Docker Compose update
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/ats-project
            
            # Login ke GHCR di VPS menggunakan GITHUB_TOKEN milik workflow runner
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull image terbaru
            docker compose -f docker-compose.prod.yml pull
            
            # Jalankan ulang service yang diperbarui
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            
            # Hapus image lama yang tidak terpakai (dangling images) untuk hemat storage VPS
            docker image prune -f
